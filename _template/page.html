<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title><!-- TITLE --> — Latent States</title>
<meta name="description" content="<!-- DESCRIPTION -->">
<link rel="icon" href="../favicon.svg" type="image/svg+xml">
<link rel="icon" href="../favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Space+Grotesk:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* === Reset === */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

/* === Palette === */
:root {
  --bg: #101012;
  --bg-surface: #18181a;
  --border: #252528;
  --text-primary: #d8d8dc;
  --text-secondary: #a0a0a8;
  --text-muted: #707078;
  --accent: #8090a0;
  --accent-alt: #a0a8b0;
  --font-heading: 'Syne', sans-serif;
  --font-body: 'Space Grotesk', sans-serif;
  --content-width: 720px;
  --page-width: 1200px;
}

/* === Base === */
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text-primary);
  font-family: var(--font-body);
  font-weight: 300;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
}
a { color: var(--accent); text-decoration: none; transition: color 0.2s; }
a:hover { color: var(--accent-alt); }

/* === Typography === */
h1 {
  font-family: var(--font-heading);
  font-size: 56px;
  font-weight: 800;
  letter-spacing: -0.03em;
  line-height: 1.05;
  color: var(--text-primary);
  margin-bottom: 16px;
}
h2 {
  font-family: var(--font-heading);
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--text-primary);
  margin-bottom: 24px;
}
h3 {
  font-family: var(--font-heading);
  font-size: 18px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 8px;
}
p {
  font-size: 16px;
  font-weight: 300;
  line-height: 1.7;
  color: var(--text-secondary);
  margin-bottom: 1.4em;
}
p:last-child { margin-bottom: 0; }

/* === Nav === */
nav {
  position: fixed;
  top: 0; left: 0; right: 0;
  z-index: 100;
  height: 52px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 32px;
  background: rgba(16, 16, 18, 0.8);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
}
.nav-logo {
  font-family: var(--font-heading);
  font-size: 16px;
  font-weight: 700;
  letter-spacing: 0.04em;
  color: var(--text-primary);
}
.nav-links { display: flex; gap: 24px; }
.nav-links a {
  font-family: var(--font-body);
  font-size: 13px;
  font-weight: 400;
  color: var(--text-secondary);
  letter-spacing: 0.02em;
}
.nav-links a:hover { color: var(--text-primary); }

/* === Layout === */
.section {
  max-width: var(--content-width);
  margin: 0 auto;
  padding: 0 24px;
}
.section-wide {
  max-width: var(--page-width);
  margin: 0 auto;
  padding: 0 32px;
}

/* === Hero image === */
.hero {
  width: 100%;
  margin-top: 52px;
}
.hero-image {
  width: 100%;
  display: block;
  object-fit: cover;
  max-height: 80vh;
}

/* === Hero info === */
.hero-info {
  padding-top: 64px;
  padding-bottom: 40px;
}
.hero-info p {
  font-size: 16px;
  color: var(--text-secondary);
  max-width: 540px;
}
.meta-line {
  font-size: 14px;
  font-weight: 400;
  color: var(--text-muted);
  margin-bottom: 8px;
}

/* === Intro === */
.intro {
  padding-bottom: 80px;
}
.intro p {
  font-size: 20px;
  font-weight: 300;
  line-height: 1.6;
  color: var(--text-secondary);
}

/* === Text section === */
.text-section {
  padding-top: 80px;
  padding-bottom: 80px;
}
.text-section ul {
  list-style: none;
  padding: 0;
  margin-top: 16px;
}
.text-section ul li {
  font-size: 16px;
  font-weight: 300;
  line-height: 1.7;
  color: var(--text-secondary);
  padding: 4px 0 4px 20px;
  position: relative;
}
.text-section ul li::before {
  content: '\2014';
  position: absolute;
  left: 0;
  color: var(--text-muted);
}
.text-section ul li strong {
  font-weight: 500;
  color: var(--text-primary);
}

/* === Metadata grid === */
.metadata-grid {
  display: grid;
  grid-template-columns: 120px 1fr;
  gap: 8px 24px;
  font-size: 14px;
  line-height: 1.6;
}
.metadata-grid dt {
  font-size: 11px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-muted);
  padding-top: 2px;
}
.metadata-grid dd {
  color: var(--text-secondary);
}

/* === 12-column asymmetric grid === */
.grid-section {
  max-width: var(--page-width);
  margin: 0 auto;
  padding: 0 32px;
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 32px;
  align-items: start;
}
.grid-section .col-text { grid-column: 7 / 13; }
.grid-section .col-images { grid-column: 1 / 7; }
.grid-section .col-text h2 { margin-bottom: 24px; }
.grid-section .col-text p {
  font-size: 16px;
  font-weight: 300;
  line-height: 1.7;
  color: var(--text-secondary);
  margin-bottom: 1.4em;
}
.grid-section .col-text p:last-child { margin-bottom: 0; }

/* === Image clusters === */
.image-cluster {
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.image-cluster .img-wrap {
  overflow: hidden;
  width: 100%;
}
.image-cluster img {
  width: 100%;
  display: block;
}
.image-row {
  display: flex;
  gap: 4px;
}
.image-row .img-wrap {
  overflow: hidden;
  flex: 1;
  min-width: 0;
}
.image-row img {
  width: 100%;
  height: 100%;
  display: block;
  object-fit: cover;
}
.image-row--thirds .img-wrap { flex: 1 1 33.33%; }
.image-row--halves .img-wrap { flex: 1 1 50%; }
.image-row--wide-left .img-wrap:first-child { flex: 2; }
.image-row--wide-left .img-wrap:last-child { flex: 1; }

/* === Image caption === */
.image-caption {
  font-size: 11px;
  font-weight: 400;
  color: var(--text-muted);
  letter-spacing: 0.02em;
  padding: 12px 32px 0;
  max-width: var(--page-width);
  margin: 0 auto;
}

/* === Blockquote === */
blockquote {
  font-family: var(--font-body);
  font-size: 18px;
  font-weight: 300;
  font-style: italic;
  line-height: 1.8;
  color: var(--text-secondary);
  border-left: 2px solid var(--border);
  padding-left: 28px;
}

/* === Cards === */
.card-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 4px;
  max-width: var(--page-width);
  margin: 0 auto;
  padding: 0 32px;
}
.card {
  display: block;
  position: relative;
  overflow: hidden;
  color: var(--text-primary);
}
.card .img-wrap {
  overflow: hidden;
  aspect-ratio: 4 / 3;
}
.card img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}
.card .card-label { padding: 16px 0 4px; }
.card-title {
  font-family: var(--font-heading);
  font-size: 16px;
  font-weight: 600;
  color: var(--text-primary);
  display: block;
}
.card-desc {
  font-size: 13px;
  font-weight: 300;
  color: var(--text-muted);
  display: block;
  margin-top: 4px;
}

/* === Credits grid === */
.credits-grid {
  display: grid;
  grid-template-columns: 140px 1fr;
  gap: 12px 24px;
  font-size: 15px;
  font-weight: 300;
  line-height: 1.6;
}
.credits-grid dt {
  font-size: 11px;
  font-weight: 500;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-muted);
  padding-top: 2px;
}
.credits-grid dd {
  color: var(--text-secondary);
}

/* === Divider === */
.divider {
  width: 48px;
  height: 1px;
  background: var(--border);
  margin: 0 0 48px;
}

/* === Info blocks === */
.info-section { margin-bottom: 36px; }
.info-label {
  font-family: var(--font-heading);
  font-weight: 600;
  font-size: 11px;
  letter-spacing: 0.25em;
  text-transform: uppercase;
  color: var(--text-muted);
  margin-bottom: 12px;
}
.info-text {
  font-size: 15px;
  line-height: 1.75;
  color: var(--text-secondary);
}

/* === Prev/Next nav === */
.project-nav {
  max-width: var(--page-width);
  margin: 120px auto 0;
  padding: 0 32px 80px;
}
.project-nav-inner {
  display: flex;
  gap: 32px;
  border-top: 1px solid var(--border);
  padding-top: 32px;
}
.nav-item {
  flex: 1;
  text-decoration: none;
  transition: opacity 0.3s;
}
.nav-item:hover { opacity: 0.8; }
.nav-direction {
  font-size: 11px;
  font-weight: 400;
  color: var(--text-muted);
  letter-spacing: 0.06em;
  margin-bottom: 6px;
}
.nav-project-title {
  font-family: var(--font-heading);
  font-size: 20px;
  font-weight: 600;
  color: var(--text-primary);
}
.nav-item--next { text-align: right; }

/* === Footer === */
footer {
  padding: 48px 32px;
  text-align: center;
  font-size: 13px;
  font-weight: 400;
  color: var(--text-muted);
  letter-spacing: 0.04em;
}

/* === Responsive === */
@media (max-width: 768px) {
  nav { padding: 0 20px; }
  h1 { font-size: 36px; }
  h2 { font-size: 24px; }
  .hero-info { padding-top: 48px; }
  .intro p { font-size: 18px; }
  .intro { padding-bottom: 56px; }
  .section { padding: 0 16px; }
  .section-wide { padding: 0 20px; }
  .grid-section {
    grid-template-columns: 1fr;
    gap: 24px;
    padding: 0 20px;
  }
  .grid-section .col-text,
  .grid-section .col-images { grid-column: 1 / -1; }
  .grid-section .col-images { order: -1; }
  .text-section { padding-top: 56px; padding-bottom: 56px; }
  blockquote { font-size: 16px; padding-left: 20px; }
  .image-row { flex-direction: column; }
  .card-grid { grid-template-columns: repeat(2, 1fr); padding: 0 20px; }
  .credits-grid { grid-template-columns: 1fr; gap: 4px 0; }
  .credits-grid dt { padding-top: 12px; }
  .metadata-grid { grid-template-columns: 1fr; gap: 4px 0; }
  .metadata-grid dt { padding-top: 8px; }
  .project-nav { padding: 0 20px 60px; }
  .project-nav-inner { flex-direction: column; gap: 24px; }
  .nav-item--next { text-align: left; }
  .image-caption { padding: 10px 20px 0; }
}

@media (max-width: 480px) {
  h1 { font-size: 30px; }
  .section { padding: 0 16px; }
  .card-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<nav>
  <a href="../index.html" class="nav-logo">LS</a>
  <div class="nav-links">
    <!-- NAV -->
  </div>
</nav>

<!-- CONTENT -->

<footer>Latent States &middot; Lisbon</footer>

</body>
</html>
